name: Deploy test.traapp.ru

on:
  workflow_dispatch:
  push:
    branches: [test]

concurrency:
  group: test-traapp-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install dependencies
        run: npm ci && npm --prefix backend ci

      - name: Verify and build
        run: |
          npm test -- --run
          npm run test:backend -- --runInBand
          npm run build
          npm run build:backend

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/traapp_deploy
          chmod 600 ~/.ssh/traapp_deploy
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts

      - name: Deploy verified artifacts
        env:
          SPREES_HOST: ${{ vars.SPREES_HOST || 'root@217.199.253.229' }}
          SPREES_SSH_KEY: /home/runner/.ssh/traapp_deploy
        run: ./scripts/deploy.sh --prebuilt
